name: Daily Auto News Update

on:
  schedule:
    # Runs at 8:00 AM UTC every day (adjust the cron time if you want a
    # different time — this is roughly 3-4am Eastern depending on DST).
    - cron: '0 8 * * *'
  workflow_dispatch: {}
    # ^ This lets you manually trigger a run any time from the GitHub
    # Actions tab, without waiting for the schedule — useful for testing.

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate today's news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-news.js

      - name: Commit and push if the news file changed
        run: |
          git config user.name "Easy Auto News Bot"
          git config user.email "actions@github.com"
          git add assets/news-data.js
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update auto news ($(date -u +%Y-%m-%d))"
          git push
